name: refresh

# Daily: rebuild the plugin and open-source lists from GitHub and open a pull request
# when index.html changes. Uses the built-in GITHUB_TOKEN, no secrets.
# Needs the repo setting: Settings > Actions > General > "Allow GitHub Actions to create pull requests".

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild index.html
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/refresh
          git add index.html
          git commit -m "Refresh the plugin and open-source lists from GitHub"
          git push --force origin bot/refresh
          if [ -z "$(gh pr list --head bot/refresh --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head bot/refresh \
              --title "Refresh the plugin and open-source lists" \
              --body "Generated by scripts/build.mjs from the GitHub API and the gago-plugins catalog. Check the descriptions and tags in the diff, then merge."
          fi
